name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURNSTILE_SECRET_KEY: ci-invalid-turnstile-secret
      DELETE_TOKEN_PEPPER: ci-invalid-delete-token-pepper-32-bytes
      IP_HASH_PEPPER: ci-invalid-ip-hash-pepper-32-bytes
      ADMIN_TOKEN: ci-invalid-admin-token-32-bytes-minimum-0123456789
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check
